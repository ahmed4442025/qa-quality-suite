<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير تدقيق الجودة | {{PROJECT_NAME}}</title>
  
  <!-- Local Stylesheet (100% Offline & Safe) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Application Bar -->
  <header class="app-header">
    <div class="container">
      <div class="header-content">
        
        <!-- Brand & Title -->
        <div class="brand-section">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
            </svg>
          </div>
          <h1 class="brand-title">تقرير تدقيق الجودة — {{PROJECT_NAME}}</h1>
        </div>

        <!-- Header Actions & Controls -->
        <div class="header-actions">
          
          <!-- Status Indicator -->
          <div class="stats-badge">
            <span class="stats-dot"></span>
            <span id="headerTasksCount">11 فحص معتمد</span>
          </div>

          <!-- Theme Switcher -->
          <button id="themeToggleBtn" type="button" class="theme-toggle-btn" title="تبديل الوضع (داكن / فاتح)">
            <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="themeIconLight" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span id="themeToggleLabel">الوضع الداكن</span>
          </button>

        </div>

      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="container">

    <!-- Filter Control Card (Streamlined, No Redundant Dropdown) -->
    <div class="filter-card">
      
      <!-- Top Row: Search & Module Filter -->
      <div class="filter-row-top">
        
        <!-- Live Instant Search -->
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="بحث سريع برقم الفحص، العنوان، أو سيناريو التجربة...">
          <button type="button" id="searchClearBtn" class="search-clear-btn" title="مسح البحث">✕</button>
        </div>

        <!-- Module Selector -->
        <div>
          <select id="moduleFilter" class="custom-select" style="width: 100%;">
            <option value="all">كل الموديولات</option>
          </select>
        </div>

      </div>

      <!-- Severity Filter Strip (Right-Aligned next to label) -->
      <div class="filter-row-section">
        <div class="filter-group-right">
          <span class="filter-section-title">مستوى الخطورة:</span>
          <div id="severityChipsContainer" class="chip-group">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>

      <!-- Category / Type Filter Strip (Single Unified Source of Truth) -->
      <div class="filter-row-section">
        <div class="filter-group-right">
          <span class="filter-section-title">تصنيف المشكلة:</span>
          <div id="typeChipsContainer" class="chip-group">
            <!-- Rendered dynamically -->
          </div>
        </div>
        <div class="filter-group-left">
          <span id="filteredCount" class="counter-text">0 من 0 فحص</span>
          <button type="button" id="resetFiltersBtn" class="filter-reset-link">
            <svg style="width: 13px; height: 13px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
              <path d="M3 21v-5h5"></path>
            </svg>
            <span>إعادة ضبط</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Data Presentation Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="qa-table">
          <thead>
            <tr>
              <th class="td-index">#</th>
              <th class="td-id">كود الفحص</th>
              <th class="td-severity">مستوى الخطورة</th>
              <th class="td-title">المشكلة</th>
              <th class="td-types">التصنيف</th>
              <th class="td-scenario">سيناريو التجربة</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Interactive Toast Notification -->
  <div id="appToast" class="toast-notice">
    <svg style="width: 16px; height: 16px; color: #10b981;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <span id="toastMessage">تم النسخ إلى الحافظة بنجاح</span>
  </div>

  <!-- Local Scripts -->
  <script src="data/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
