<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>مِعيار — ضمان الجودة</title>
    <script>
      try {
        var preference = localStorage.getItem("qa_theme");
        document.documentElement.dataset.theme =
          preference ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="app/css/fonts.css" />
    <link rel="stylesheet" href="app/css/style.css" />
    <script src="config.js" defer></script>
    <script src="app/js/model.js" defer></script>
    <script src="app/js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#resultsHeading">انتقل إلى المشاكل</a>
    <header class="app-header">
      <div class="header-inner">
        <a
          class="brand"
          href="app/index.html"
          aria-label="مِعيار — الصفحة الرئيسية"
        >
          <svg
            class="brand-mark"
            viewBox="0 0 40 40"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M7 14V7h7M26 7h7v7M33 26v7h-7M14 33H7v-7"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="m12 20 5 5 11-11"
              stroke="currentColor"
              stroke-width="2.5"
            />
          </svg>
          <span class="brand-name"
            >مِعيار<span class="brand-caption">هندسة الجودة</span></span
          >
        </a>
        <div class="project-context">
          <span class="context-label">مساحة المشروع</span
          ><span id="projectName" class="project-name" dir="auto"
            >اسم المشروع</span
          >
        </div>
        <div class="header-actions">
          <button type="button" class="button subtle" id="refreshBtn" aria-label="تحديث البيانات" title="تحديث البيانات">
            <span data-icon="refresh"></span
            ><span class="refresh-label">تحديث البيانات</span>
          </button>
          <span class="header-divider" aria-hidden="true"></span>
          <button
            type="button"
            class="icon-button"
            id="themeToggleBtn"
            aria-label="تفعيل الوضع الداكن"
            title="تفعيل الوضع الداكن"
          >
            <span data-icon="moon"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="workspace" id="mainContent">
      <section class="metrics" aria-label="ملخص الجودة — اضغط لتصفية المشاكل">
        <button
          type="button"
          class="metric"
          data-preset="open"
          aria-pressed="false"
        >
          <span class="metric-top"
            >مشاكل مفتوحة<span data-icon="layers"></span></span
          ><span class="metric-value mono" id="statOpen">0</span>
        </button>
        <div class="priority-metric" role="group" aria-label="الأولوية المفتوحة">
          <button
            type="button"
            class="priority-segment priority-critical"
            data-preset="critical"
            aria-pressed="false"
          >
            <span class="metric-top"
              ><span class="status-dot"></span>حرجة<span data-icon="alert"></span></span
            ><span class="metric-value mono" id="statCritical">0</span>
          </button><button
            type="button"
            class="priority-segment priority-high"
            data-preset="high"
            aria-pressed="false"
          >
            <span class="metric-top"
              ><span class="status-dot"></span>عالية<span data-icon="activity"></span></span
            ><span class="metric-value mono" id="statHigh">0</span>
          </button>
        </div>
        <button
          type="button"
          class="metric"
          data-preset="in_progress"
          aria-pressed="false"
        >
          <span class="metric-top"
            >جاري العمل<span data-icon="activity"></span></span
          ><span class="metric-value mono" id="statInProgress">0</span>
        </button>
        <button
          type="button"
          class="metric total-metric"
          data-preset="all"
          aria-pressed="false"
        >
          <span class="metric-top">إجمالي المشاكل<span data-icon="layers"></span></span
          ><span class="metric-value mono" id="statTotal">0</span>
        </button>
      </section>
      <section class="issues-section" aria-labelledby="resultsHeading">
        <h2 id="resultsHeading" class="sr-only" tabindex="-1">مشاكل المشروع</h2>
        <div class="section-header">
          <div class="completion-compact">
            <span class="completion-label-short">تم الحل</span>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="نسبة الإنجاز ضمن الفلاتر الحالية"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              id="completionProgress"
            >
              <span></span>
            </div>
            <span class="mono" id="completionValue">0 / 0</span>
            <span id="completionCaption" class="sr-only">نسبة الإنجاز ضمن الفلاتر الحالية</span>
          </div>
          <div class="view-switch" role="group" aria-label="طريقة عرض المشاكل">
            <button type="button" data-view="list" aria-pressed="true">
              <span data-icon="list"></span>القائمة</button
            ><button type="button" data-view="report" aria-pressed="false">
              <span data-icon="document"></span>التفاصيل
            </button
            ><button type="button" data-view="board" aria-pressed="false">
              <span data-icon="board"></span>لوحة المهام
            </button>
          </div>
        </div>
        <div class="workbench">
          <div class="filter-toolbar">
            <div class="search-field">
              <span data-icon="search"></span
              ><label class="sr-only" for="searchInput"
                >البحث في المشاكل والكود والملفات</label
              ><input
                id="searchInput"
                type="search"
                placeholder="ابحث بالعنوان، كود المشكلة، أو الملف…"
                autocomplete="off"
              /><kbd aria-hidden="true">/</kbd>
              <button type="button" class="icon-button search-clear" id="clearSearchBtn" aria-label="مسح البحث" title="مسح البحث" hidden><span data-icon="close"></span></button>
            </div>
            <div class="module-field">
              <label class="sr-only" for="moduleFilter">الوحدة</label
              ><select id="moduleFilter">
                <option value="all">كل الوحدات</option>
              </select>
            </div>
            <div class="status-filter-group" role="group" aria-label="تصفية حسب الحالة، يمكن اختيار أكثر من حالة">
              <button type="button" data-status-filter="pending" aria-pressed="false" aria-label="تصفية بقيد الانتظار" title="قيد الانتظار"><span data-icon="clock"></span></button>
              <button type="button" data-status-filter="in_progress" aria-pressed="false" aria-label="تصفية بجاري العمل" title="جاري العمل"><span data-icon="activity"></span></button>
              <button type="button" data-status-filter="done" aria-pressed="false" aria-label="تصفية بتم الحل" title="تم الحل"><span data-icon="check"></span></button>
              <button type="button" data-status-filter="archived" aria-pressed="false" aria-label="تصفية بالمؤرشف" title="مؤرشف"><span data-icon="archive"></span></button>
              <button type="button" data-status-filter="cancelled" aria-pressed="false" aria-label="تصفية بالملغي" title="ملغي"><span data-icon="cancel"></span></button>
            </div>
            <details class="advanced-filters" id="filterPanel">
              <summary>
                <span data-icon="filter"></span>الفلاتر<span
                  id="filterBadge"
                  class="filter-badge"
                  hidden
                  >0</span
                ><span data-icon="chevron"></span>
              </summary>
              <div class="filter-popover">
                <div class="popover-heading">
                  <strong>خصص النتائج</strong
                  ><button
                    type="button"
                    id="closeFiltersBtn"
                    class="icon-button"
                    aria-label="إغلاق الفلاتر"
                  >
                    <span data-icon="close"></span>
                  </button>
                </div>
                <div class="filter-fields">
                  <div class="field">
                    <label for="severityFilter">الأهمية</label
                    ><select id="severityFilter">
                      <option value="all">كل المستويات</option>
                      <option value="Critical">حرجة</option>
                      <option value="High">عالية</option>
                      <option value="Medium">متوسطة</option>
                      <option value="Low">منخفضة</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="culpritFilter">المنصة المتأثرة</label
                    ><select id="culpritFilter">
                      <option value="all">كل المنصات</option>
                      <option value="Mobile">تطبيق الموبايل</option>
                      <option value="Backend">الخادم</option>
                      <option value="Both">الموبايل والخادم معًا</option>
                    </select>
                  </div>
                </div>
                <fieldset class="type-fieldset">
                  <legend>نوع المشكلة</legend>
                  <div class="type-options" id="typeOptions"></div>
                  <div class="type-actions">
                    <button type="button" class="text-button" id="allTypesBtn">
                      اختيار الكل</button
                    ><button type="button" class="text-button" id="noTypesBtn">
                      إلغاء الاختيار
                    </button>
                  </div>
                </fieldset>
              </div>
            </details>
            <div class="sort-field">
              <span data-icon="sort" aria-hidden="true"></span>
              <label class="sr-only" for="sortSelect">ترتيب المشاكل</label>
              <select id="sortSelect" aria-label="ترتيب المشاكل">
                <option value="priority">الأعلى أهمية</option>
                <option value="status">الحالة</option>
                <option value="id">كود المشكلة</option>
              </select>
            </div>
          </div>
          <div class="results-context">
            <strong id="resultsSummary" class="results-summary" role="status" aria-live="polite">0 مشكلة</strong>
            <div class="active-filters" id="activeFiltersBar" hidden>
              <span class="muted">النتائج حسب:</span>
              <div id="activeFilters" class="filter-chips"></div>
              <button
                type="button"
                class="text-button reset-button"
                data-action="reset"
              >
                مسح الفلاتر
              </button>
            </div>
          </div>
          <div id="results"></div>
          <div class="pagination" id="pagination" hidden>
            <div class="page-size-field">
              <label for="pageSizeSelect">عرض</label>
              <select id="pageSizeSelect" aria-label="عدد المشاكل في الصفحة">
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
              <span>مشكلة</span>
            </div>
            <nav class="pagination-actions" aria-label="صفحات المشاكل">
              <button type="button" class="page-arrow" id="prevPageBtn" aria-label="الصفحة السابقة">
                <span data-icon="arrow-right"></span></button
              ><div class="page-numbers" id="pageNumbers"></div
              ><button type="button" class="page-arrow" id="nextPageBtn" aria-label="الصفحة التالية">
                <span data-icon="arrow"></span>
              </button>
            </nav>
            <span id="pageInfo" class="sr-only" role="status" aria-live="polite"></span>
          </div>
        </div>
      </section>
      <footer class="workspace-footer">
        <span class="footer-brand"
          >مِعيار<span class="footer-separator">/</span>كل تفصيلة تصنع
          فرقًا.</span
        ><span id="dataNote">الحالات مرتبطة بملفات المشروع</span>
      </footer>
      <noscript
        ><div class="notice">
          فعّل JavaScript لعرض نتائج الفحص والتفاعل معها.
        </div></noscript
      >
    </main>
    <dialog id="taskDialog" class="task-dialog" aria-labelledby="detailTitle">
      <div
        class="drawer-resize-handle"
        id="drawerResizeHandle"
        role="separator"
        aria-label="تغيير عرض لوحة التفاصيل"
        aria-orientation="vertical"
        aria-valuemin="440"
        aria-valuemax="1100"
        aria-valuenow="760"
        aria-controls="detailContent"
        tabindex="0"
        title="اسحب لتغيير العرض · نقرتان لإعادة الضبط"
      ></div>
      <div class="dialog-shell">
        <header class="dialog-header">
          <div class="dialog-heading-row" id="detailHeaderMeta"></div>
          <button
            type="button"
            class="icon-button"
            id="closeDetailBtn"
            aria-label="إغلاق تفاصيل المشكلة"
            autofocus
          >
            <span data-icon="close"></span>
          </button>
        </header>
        <div class="dialog-content" id="detailContent"></div>
        <footer class="dialog-footer">
          <span id="detailPosition" class="muted"></span>
          <div class="pagination-actions">
            <button type="button" class="button subtle" id="prevTaskBtn">
              <span data-icon="arrow-right"></span>السابقة</button
            ><button type="button" class="button subtle" id="nextTaskBtn">
              التالية<span data-icon="arrow"></span>
            </button>
          </div>
        </footer>
      </div>
    </dialog>
    <div class="toast" id="toast" hidden>
      <span class="toast-icon" id="toastIcon"></span>
      <p
        id="toastMessage"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <button type="button" class="text-button" id="toastAction" hidden>
        تراجع</button
      ><button
        type="button"
        class="icon-button"
        id="dismissToastBtn"
        aria-label="إغلاق التنبيه"
      >
        <span data-icon="close"></span>
      </button>
    </div>
    <script src="data/manifest.js"></script>
  </body>
</html>
